<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JK BrandOS — no connection</title>
<!--
  Shown only when a page load fails because the phone has no network.

  It is the ONE file the service worker keeps. Nothing else is cached, on
  purpose: a worker that caches the app will one day serve somebody last
  month's CRM and Ctrl+Shift+R will not shift it. See sw.js.

  Everything here is inline — no fonts, no scripts from elsewhere. A file
  that needs the network to render is no use on a screen that exists
  because the network is gone.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f0f0f;
    color: #e5e5e5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px calc(16px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .card { max-width: 420px; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 24px;
    border-radius: 18px;
    background: #FF5E00;
    color: #fff;
    font-weight: 700; font-size: 26px; letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; color: #fff; }
  p { font-size: 15px; line-height: 1.6; color: #a3a3a3; margin: 0 0 8px; }
  .hint { font-size: 13px; color: #737373; margin-top: 18px; }
  button {
    margin-top: 26px;
    background: #FF5E00; color: #fff; border: 0;
    border-radius: 12px;
    padding: 14px 30px;
    font-size: 15px; font-weight: 600;
    min-height: 48px;
    cursor: pointer;
  }
  button:active { background: #e05200; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">JK</div>
    <h1>No connection</h1>
    <p>JK BrandOS needs the internet. Your work is safe — nothing was lost.</p>
    <p class="hint">Check mobile data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
